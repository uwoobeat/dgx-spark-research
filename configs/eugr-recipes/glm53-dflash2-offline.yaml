recipe_version: "1"
name: GLM-5.3-Flash-NVFP4-DFlash2-offline
description: Pinned tonyd2wild SM121 DFlash2 TP2 profile for the air-gapped two-Spark cluster
container: ghcr.io/tonyd2wild/vllm-glm53-flash@sha256:4def0ef644cb2e9814136dcffd5e385e21bc594f48f3b292234051904abe85a6
cluster_only: true

defaults:
  port: 8000
  host: 127.0.0.1
  tensor_parallel: 2
  gpu_memory_utilization: 0.85
  max_model_len: 262144

env:
  HF_HOME: /cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ENGINE_READY_TIMEOUT_S: "3600"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TORCH_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_CUDA_ARCH_LIST: 12.1a
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET
  NCCL_NVLS_ENABLE: "0"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_MERGE_NICS: "0"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  TORCH_NCCL_ASYNC_ERROR_HANDLING: "1"

command: |
  vllm serve /models/glm53 \
    --served-model-name glm-5.3-flash \
    --host {host} \
    --port {port} \
    --trust-remote-code \
    --tensor-parallel-size {tensor_parallel} \
    --gpu-memory-utilization {gpu_memory_utilization} \
    --max-model-len {max_model_len} \
    --max-num-seqs 1 \
    --max-num-batched-tokens 8192 \
    --block-size 2304 \
    --moe-backend marlin \
    --speculative-config '{{"method":"dflash","model":"/models/dflash2-draft","num_speculative_tokens":7}}' \
    --kv-cache-dtype fp8_e4m3 \
    --enforce-eager \
    --tool-call-parser glm47 \
    --enable-auto-tool-choice \
    --reasoning-parser glm45 \
    --default-chat-template-kwargs '{{"enable_thinking":false}}' \
    --chat-template /models/glm53/chat_template_mm.jinja
